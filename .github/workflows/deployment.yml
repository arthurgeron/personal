name: Deploy to Production

on:
  push:
    branches: [main]
  # the scheduled run rebuilds the site with fresh GitHub and npm figures
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    environment: Prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Get Bun version from .tool-versions
        id: get-bun-version
        run: echo "BUN_VERSION=$(grep 'bun' .tool-versions | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Get Node.js version from .tool-versions
        id: get-node-version
        run: echo "NODE_VERSION=$(grep 'nodejs' .tool-versions | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.get-node-version.outputs.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.get-bun-version.outputs.BUN_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Cache build
        uses: actions/cache@v6
        with:
          path: |
            dist
            .rspack-cache
          key: ${{ runner.os }}-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Refresh GitHub and npm stats
        continue-on-error: true
        run: bun run stats
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build
        run: bun run build
        
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftp
          local-dir: ./dist/
          server-dir: /public_html/
          dangerous-clean-slate: ${{ github.event_name == 'push' }}
          timeout: 120000
          log-level: verbose 